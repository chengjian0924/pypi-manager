<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1017" media="(prefers-color-scheme: dark)">
<title>Wheelhouse · 内网 Python 包仓库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f5fd0'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' transform='translate(3.5 3.5) scale(.71)'%3E%3Cpath d='M21 8.5 12 3 3 8.5v7L12 21l9-5.5v-7Z'/%3E%3Cpath d='M3 8.5 12 14l9-5.5'/%3E%3Cpath d='M12 14v7'/%3E%3C/g%3E%3C/svg%3E">
<script>
(function(){
  var KEY = "pm_theme";
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e) {}
  var mode = (saved === "light" || saved === "dark") ? saved : "auto";
  var mql = window.matchMedia("(prefers-color-scheme: dark)");
  function apply(m){
    var eff = m === "auto" ? (mql.matches ? "dark" : "light") : m;
    document.documentElement.setAttribute("data-mode", m);
    document.documentElement.setAttribute("data-theme", eff);
  }
  apply(mode);
  var onChange = function(){
    if (document.documentElement.getAttribute("data-mode") === "auto") apply("auto");
  };
  if (mql.addEventListener) mql.addEventListener("change", onChange);
  else if (mql.addListener) mql.addListener(onChange);
  window.__applyTheme = apply;
})();
</script>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/components.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
